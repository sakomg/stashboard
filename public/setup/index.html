<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Set up Stashboard</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/common/base.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <link rel="stylesheet" href="/common/auth.css" />
  </head>
  <body class="login-page">
    <main class="login">
      <a class="brand" href="/"
        ><img src="/logo.svg" alt="" width="28" height="28" /><span>stash</span><span>board</span></a
      >

      <form id="account">
        <h1>Create your account</h1>
        <p class="lead">This dashboard has no owner yet. The setup code proves the server is yours.</p>
        <label>
          <span>Setup code</span>
          <input
            name="setupCode"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="characters"
            placeholder="XXXX-XXXX-XXXX"
            required
            autofocus
          />
          <small>Printed in the server log on every start, and by the deploy script.</small>
        </label>
        <label>
          <span>Name</span>
          <input
            name="username"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            maxlength="32"
            required
          />
          <small>You sign in with it. Up to 32 letters, digits, spaces, dots, dashes and underscores.</small>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" minlength="12" required />
          <small>At least 12 characters.</small>
        </label>
        <label>
          <span>Repeat the password</span>
          <input name="repeat" type="password" autocomplete="new-password" required />
        </label>
        <button class="button primary" type="submit">Continue</button>
        <p class="form-error" id="account-error" role="alert" hidden></p>
      </form>

      <form id="authenticator" hidden>
        <h1>Add an authenticator</h1>
        <p class="lead">
          Scan this with an authenticator app such as Google Authenticator, 1Password or Aegis. You will need a code
          from it every time you sign in.
        </p>
        <img class="qr" id="qr" alt="QR code for the authenticator app" width="220" height="220" />
        <p class="key"><span>Or enter this key by hand</span><code id="key"></code></p>
        <label>
          <span>Code the app shows now</span>
          <input
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9 ]{6,7}"
            maxlength="7"
            required
          />
        </label>
        <button class="button primary" type="submit">Create account</button>
        <button class="link" id="back" type="button">Start again</button>
        <p class="form-error" id="authenticator-error" role="alert" hidden></p>
      </form>
    </main>
    <script type="module" src="/setup/setup.js"></script>
  </body>
</html>
