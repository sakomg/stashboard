services:
  stashboard:
    build: .
    image: stashboard:latest
    container_name: stashboard
    restart: unless-stopped
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    environment:
      HOST: 0.0.0.0
      TRUST_PROXY: '1'
    volumes:
      - ./config.json:/app/config.json:ro
      - stashboard-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    container_name: stashboard-caddy
    restart: unless-stopped
    depends_on:
      - stashboard
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, for example DOMAIN=example.duckdns.org}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '3'

volumes:
  stashboard-data:
  caddy-data:
  caddy-config:
